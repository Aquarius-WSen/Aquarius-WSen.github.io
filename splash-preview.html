<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封面候选对比 · 图1 / 图3 / 图5</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F6F2E9; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; color: #1F2933; }
  .strip {
    position: relative;
    height: 52vh;
    min-height: 300px;
    overflow: hidden;
  }
  .strip img { width: 100%; height: 100%; object-fit: cover; object-position: center 45%; display: block; }
  .strip::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: -1px; height: 90px;
    background: linear-gradient(180deg, rgba(246,242,233,0), #F6F2E9);
  }
  .tag {
    position: absolute; top: 18px; left: 24px; z-index: 2;
    padding: 6px 16px; border-radius: 999px;
    background: rgba(31,41,51,0.55); color: #FCFAF3;
    font-size: 13px; letter-spacing: 0.08em;
  }
  .brand {
    position: absolute; left: 86px; bottom: 46px; z-index: 2;
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 10px; letter-spacing: 0.22em; color: rgba(252,250,243,0.95);
    text-transform: uppercase;
  }
  .note { padding: 26px 86px 10px; font-size: 13px; color: #6B7280; line-height: 1.8; }
  .note b { color: #1F2933; }
  .gap { height: 34px; }
</style>
</head>
<body>
  <p class="note">三张候选按真实封面比例（52vh、左下角品牌行）排布，均已去掉「豆包AI生成」水印。往下滚动依次是 <b>图1 / 图3 / 图5</b>。选定后告诉我编号即可。</p>
  <div class="gap"></div>

  <div class="strip">
    <span class="tag">候选 · 图1</span>
    <img src="assets/splash-1.jpg" alt="候选图1">
    <span class="brand">Wang Sen · Attorney at Law</span>
  </div>

  <div class="gap"></div>

  <div class="strip">
    <span class="tag">候选 · 图3</span>
    <img src="assets/splash-3.jpg" alt="候选图3">
    <span class="brand">Wang Sen · Attorney at Law</span>
  </div>

  <div class="gap"></div>

  <div class="strip">
    <span class="tag">候选 · 图5</span>
    <img src="assets/splash-5.jpg" alt="候选图5">
    <span class="brand">Wang Sen · Attorney at Law</span>
  </div>

  <div class="gap"></div>
</body>
</html>
